[server]
protocol = http
serve_from_sub_path = true
root_url = %(protocol)s://%(domain)s/grafana/

[auth.anonymous]
enabled = true
org_role = Viewer

[auth]
disable_login_form = true

[security]
allow_embedding = true

[analytics]
reporting_enabled = false
check_for_updates = false

[news]
news_feed_enabled = false

[paths]
data = /tmp/grafana/data
logs = /tmp/grafana/logs
plugins = /tmp/grafana/plugins
provisioning = /home/runner/workspace/observability/grafana/provisioning

[dashboards]
default_home_dashboard_path = /home/runner/workspace/observability/grafana/dashboards/jobscan.json
